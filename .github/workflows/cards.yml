name: profile cards

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - "assets/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

# one run at a time, so two runs never race to push
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools (pyftsubset) and Pillow
        run: pip install fonttools pillow

      # 1) the daily refresh: contribution calendar + repo stats -> data/contributions.json
      #    Public contributions only with the default token. To include private ones, add a
      #    PAT (read:user) as the repository secret PROFILE_TOKEN and enable
      #    "Include private contributions on my profile" in your GitHub profile settings.
      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: ./scripts/fetch_data.sh

      # 2) render the animated cards into cards/
      - name: Render cards
        run: python3 scripts/render_cards.py

      # 3) commit data and cards when something changed
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile cards"
            git push || { git pull --rebase && git push; }
          fi
