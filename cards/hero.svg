<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-labelledby="t d"><title id="t">Ева Валлисту - backend-разработчик на Python</title><desc id="d">Backend-разработчик на Python. Проектирую API и сервисы на FastAPI и SQLAlchemy.</desc><style>@font-face{font-family:'Card Body';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Card Display';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Card Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}:root{--bg:#fbfbfa;--ink:#121413;--ink2:#5c615e;--ink3:#8a8f8c;--rule:#e3e5e2;--plate:#f0f1ef;--accent:#0f766e;--l0:#f0f1ef;--l1:#b1cfcb;--l2:#80b4ae;--l3:#47958e;--l4:#0f766e;--acs:#80b4ae}@media (prefers-color-scheme:dark){:root{--bg:#0f1110;--ink:#eceeec;--ink2:#a3a9a5;--ink3:#727874;--rule:#262a28;--plate:#181b1a;--accent:#4fd1c0;--l0:#181b1a;--l1:#274e48;--l2:#34766d;--l3:#41a496;--l4:#4fd1c0;--acs:#34766d}}.bg{fill:var(--bg)}.pl{fill:var(--plate)}.ink{fill:var(--ink)}.i2{fill:var(--ink2)}.i3{fill:var(--ink3)}.ac{fill:var(--accent)}.acs{fill:var(--acs)}.nf{fill:none}.sr{stroke:var(--rule)}.sa{stroke:var(--accent)}.si{stroke:var(--ink)}.s2{stroke:var(--ink2)}.l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}.fd{font-family:'Card Display',Inter,system-ui,sans-serif;font-weight:600}.fb{font-family:'Card Body',Inter,system-ui,sans-serif;font-weight:400}.fm{font-family:'Card Mono','IBM Plex Mono',ui-monospace,monospace;font-weight:400}.tn{font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.rise{animation:rise .7s cubi